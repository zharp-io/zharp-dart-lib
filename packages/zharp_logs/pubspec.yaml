name: zharp_logs
description: Send logs from Dart servers, CLIs and web apps to Zharp. Building a Flutter app? Use zharp_logs_flutter, which adds automatic crash capture.
version: 0.1.3
homepage: https://zharp.io
repository: https://github.com/zharp-io/zharp-dart-lib/tree/main/packages/zharp_logs
issue_tracker: https://github.com/zharp-io/zharp-dart-lib/issues
documentation: https://zharp.io/docs/sdks/logs

environment:
  sdk: ^3.3.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
