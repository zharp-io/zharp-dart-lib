documentation: https://zharp.io/docs/sdks/flutter

environment:
  sdk: ^3.3.0

dependencies:
  http: ^1.2.0
  logging: ^1.2.0

dev_dependencies:
  fake_async: ^1.3.0
  lints: ^4.0.0
  test: ^1.25.0
